<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cửa hàng – HomeCare</title><link rel="stylesheet" href="/site.css">
<style>
main{max-width:1100px;margin:20px auto;padding:0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.bar input{flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;background:var(--card)}
td,th{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left}.wrap{overflow-x:auto;margin-bottom:10px}
form.f{display:grid;gap:10px;max-width:420px;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1;min-width:110px}
#pd{flex-basis:100%;min-height:84px;resize:vertical}
#pf-preview{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px;border:1px solid var(--bd);border-radius:6px;color:var(--mut);font-size:13px}
#pf-preview img{width:56px;height:48px;object-fit:cover;border-radius:4px}
.shop-product{display:flex;flex-direction:column;gap:7px}
.shop-product .img{min-height:150px}
.product-description{margin:0;color:var(--mut);font-size:13px;white-space:pre-line}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}.locked{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}.stats b{display:block;font-size:22px;color:var(--pri)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;color:#fff;display:none;z-index:9}
h2{margin:6px 0 14px}
</style></head><body>
<header><a class="logo" href="/">HomeCare</a><nav><a class="lnk" href="/">Trang chủ</a><a class="lnk" href="/khuyen-mai.html">Khuyến mãi</a><span id="nav" style="display:contents"></span></nav></header>
<main id="main"></main><div id="toast"></div>
<script>
const shopParams=new URLSearchParams(location.search);
let me=null,cart=JSON.parse(localStorage.getItem('cart')||'[]'),view='shop',cat=Number(shopParams.get('category'))||'',q=shopParams.get('q')||'',sort='',prods=[],cats=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Number(n).toLocaleString('vi-VN')+'₫',isStaff=()=>me&&me.role!=='CUSTOMER';
const ST={PENDING:'Chờ xác nhận',SHIPPING:'Đang giao',DELIVERED:'Đã giao',CANCELLED:'Đã hủy'},PAY={COD:'Thanh toán khi nhận hàng',BANK:'Chuyển khoản',MOMO:'Ví MoMo'},ROLE={ADMIN:'Admin',STAFF:'Nhân viên',CUSTOMER:'Khách hàng'};
const pic=(p,h)=>p.image&&p.image[0]==='/'?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" style="width:100%;height:${h}px;object-fit:cover;border-radius:8px">`:`<span style="font-size:${Math.round(h*.45)}px;line-height:${h}px">${esc(p.image||'🏠')}</span>`;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'var(--bad)':'var(--ok)';t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Có lỗi xảy ra');return d}
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message,1)}};
const saveCart=()=>{localStorage.setItem('cart',JSON.stringify(cart));nav()};
function go(v){view=v;nav();({shop,cartV,ordersV,adminV,login:()=>authV('login'),register:()=>authV('register')})[v]()}
function nav(){const b=(v,t)=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${t}</button>`;
$('#nav').innerHTML=b('shop','Cửa hàng')+b('cartV','🛒 Giỏ ('+cart.reduce((s,i)=>s+i.qty,0)+')')+
(me?b('ordersV','Đơn hàng')+(isStaff()?b('adminV','Quản trị'):'')+`<span class="mut" style="align-self:center">👤 ${esc(me.fullName)} (${ROLE[me.role]})</span><button onclick="logout()">Đăng xuất</button>`:b('login','Đăng nhập')+b('register','Đăng ký'))}
const logout=run(async()=>{await api('POST','/api/logout');me=null;toast('Đã đăng xuất');go('shop')});

// ---- Cửa hàng: lọc danh mục, tìm kiếm, sắp xếp ----
const shop=run(async()=>{cats=await api('GET','/api/categories');prods=await api('GET','/api/products?'+(cat?'category='+cat+'&':'')+'q='+encodeURIComponent(q));draw()});
function draw(){const l=[...prods];if(sort==='asc')l.sort((a,b)=>a.price-b.price);if(sort==='desc')l.sort((a,b)=>b.price-a.price);
$('#main').innerHTML=`<div class="bar"><input id="q" placeholder="🔍 Tìm sản phẩm (nhấn Enter)..." value="${esc(q)}" onkeydown="if(event.key==='Enter'){q=this.value;shop()}">
<select onchange="sort=this.value;draw()"><option value="">Sắp xếp</option><option value="asc" ${sort==='asc'?'selected':''}>Giá tăng dần</option><option value="desc" ${sort==='desc'?'selected':''}>Giá giảm dần</option></select></div>
<div class="bar"><button class="${cat?'':'on'}" onclick="cat='';shop()">Tất cả</button>${cats.map(c=>`<button class="${cat===c.id?'on':''}" onclick="cat=${c.id};shop()">${esc(c.name)}</button>`).join('')}</div>
<p class="mut">${l.length} sản phẩm</p><div class="grid">${l.map(p=>`<div class="card shop-product"><div class="img">${pic(p,150)}</div><b>${esc(p.name)}</b><div class="mut">${esc(p.category?.name)} • Còn ${p.stock}</div>
<p class="product-description">${esc(p.description||'Chưa có mô tả sản phẩm.')}</p><div class="price">${vnd(p.price)}</div><button class="p" style="width:100%;margin-top:8px" ${p.stock?'':'disabled'} onclick="addCart(${p.id})">${p.stock?'Thêm vào giỏ':'Hết hàng'}</button></div>`).join('')||'<p>Không có sản phẩm phù hợp.</p>'}</div>`}
function addCart(id){const p=prods.find(x=>x.id===id),i=cart.find(x=>x.id===id);if(i){if(i.qty>=p.stock)return toast('Đã đạt số lượng tối đa trong kho',1);i.qty++}else cart.push({id,name:p.name,price:p.price,qty:1,stock:p.stock,image:p.image});saveCart();toast('Đã thêm vào giỏ')}

// ---- Giỏ hàng & đặt hàng ----
function cartV(){const tot=cart.reduce((s,i)=>s+i.price*i.qty,0);
$('#main').innerHTML=`<h2>Giỏ hàng</h2>`+(cart.length?`<div class="wrap"><table><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr>
${cart.map((i,n)=>`<tr><td><span style="display:inline-block;width:44px;vertical-align:middle;text-align:center">${pic(i,44)}</span> ${esc(i.name)}</td><td>${vnd(i.price)}</td><td><input type="number" min="1" max="${i.stock}" value="${i.qty}" style="width:70px" onchange="setQty(${n},this.value)"></td><td>${vnd(i.price*i.qty)}</td><td><button class="d" onclick="cart.splice(${n},1);saveCart();cartV()">Xóa</button></td></tr>`).join('')}</table></div>
<h3>Tổng: <span class="price">${vnd(tot)}</span></h3>
<h3>Thông tin giao hàng</h3><form class="f" onsubmit="event.preventDefault();order()">
<input id="n" placeholder="Họ tên" value="${esc(me?.fullName||'')}" required><input id="ph" placeholder="Số điện thoại (0xxxxxxxxx)" required>
<input id="ad" placeholder="Địa chỉ giao hàng" required><select id="pm">${Object.entries(PAY).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
<button class="p">✅ Xác nhận đặt hàng</button></form>`:'<p>Giỏ hàng trống. <a href="#" onclick="go(\'shop\');return false" class="price">Tiếp tục mua sắm</a></p>')}
function setQty(n,v){v=parseInt(v);const i=cart[n];if(!(v>=1))v=1;if(v>i.stock){v=i.stock;toast('Chỉ còn '+i.stock+' sản phẩm',1)}i.qty=v;saveCart();cartV()}
const order=run(async()=>{if(!me){toast('Vui lòng đăng nhập để đặt hàng',1);return go('login')}
const o=await api('POST','/api/orders',{name:$('#n').value,phone:$('#ph').value,address:$('#ad').value,payment:$('#pm').value,items:cart.map(i=>({id:i.id,qty:i.qty}))});
cart=[];saveCart();toast('Đặt hàng thành công! Mã đơn #'+o.id);go('ordersV')});

// ---- Đơn hàng ----
const ordersV=run(async()=>{const os=await api('GET','/api/orders');
$('#main').innerHTML=`<h2>${isStaff()?'Quản lý đơn hàng':'Lịch sử mua hàng'}</h2>`+(os.map(o=>`<div class="card" style="margin-bottom:12px"><b>Đơn #${o.id}</b> <span class="tag">${ST[o.status]}</span>
<span class="mut"> ${o.createdAt.replace('T',' ').slice(0,16)}</span><div class="mut">${esc(o.customerName)} • ${esc(o.phone)} • ${esc(o.address)} • ${PAY[o.payment]}</div>
<ul>${o.items.map(i=>`<li>${esc(i.productName)} × ${i.qty} — ${vnd(i.price*i.qty)}</li>`).join('')}</ul><b class="price">Tổng: ${vnd(o.total)}</b>
<div class="row">${isStaff()?`<select onchange="setSt(${o.id},this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select>`:
(o.status==='PENDING'?`<button class="d" onclick="setSt(${o.id},'CANCELLED')">Hủy đơn</button>`:'')}</div></div>`).join('')||'<p>Chưa có đơn hàng.</p>')});
const setSt=run(async(id,st)=>{try{await api('PUT','/api/orders/'+id+'/status',{status:st});toast('Đã cập nhật')}finally{ordersV()}});

// ---- Quản trị: thống kê, danh mục, sản phẩm, tài khoản ----
const adminV=run(async()=>{const[st,ps,cs]=await Promise.all([api('GET','/api/stats'),api('GET','/api/products'),api('GET','/api/categories')]);prods=ps;cats=cs;
const us=me.role==='ADMIN'?await api('GET','/api/users'):[],adm=me.role==='ADMIN';
$('#main').innerHTML=`<h2>Tổng quan</h2><div class="stats"><div class="card">Đơn hàng<b>${st.orders}</b></div><div class="card">Chờ xác nhận<b>${st.pending}</b></div><div class="card">Doanh thu<b>${vnd(st.revenue)}</b></div><div class="card">Sản phẩm<b>${st.products}</b></div><div class="card">Tài khoản<b>${st.users}</b></div></div>
<h2>Quản lý danh mục</h2><form class="row" onsubmit="event.preventDefault();saveC()"><input type="hidden" id="cid"><input id="cn" placeholder="Tên danh mục" required><input id="cd" placeholder="Mô tả"><button class="p">Lưu</button></form>
<div class="wrap"><table><tr><th>Tên</th><th>Mô tả</th><th></th></tr>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.description)}</td><td><button onclick="editC(${c.id})">Sửa</button> ${adm?`<button class="d" onclick="delC(${c.id})">Xóa</button>`:''}</td></tr>`).join('')}</table></div>
<h2 style="margin-top:24px">Quản lý sản phẩm</h2><form class="row" onsubmit="event.preventDefault();saveP()"><input type="hidden" id="pid">
<input id="pn" placeholder="Tên sản phẩm" required><select id="pc" required>${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="pi" placeholder="Emoji nếu chưa có ảnh" maxlength="4"><input id="pp" type="number" min="1" placeholder="Giá" required><input id="ps" type="number" min="0" placeholder="Tồn kho" required>
<textarea id="pd" maxlength="1000" placeholder="Mô tả sản phẩm (tối đa 1000 ký tự)"></textarea>
<input id="pf" type="file" accept="image/jpeg,image/png,image/webp" title="Chọn ảnh JPG, PNG hoặc WEBP (tối đa 2MB)" onchange="previewProductImage()"><div id="pf-preview" aria-live="polite">Chưa chọn ảnh (JPG, PNG hoặc WEBP, tối đa 2MB)</div><button class="p">Lưu sản phẩm</button></form>
<div class="wrap"><table><tr><th style="width:60px">Ảnh</th><th>Tên</th><th>Mô tả</th><th>Danh mục</th><th>Giá</th><th>Kho</th><th></th></tr>${ps.map(p=>`<tr><td style="text-align:center">${pic(p,40)}</td><td>${esc(p.name)}</td><td>${esc(p.description||'')}</td><td>${esc(p.category?.name)}</td><td>${vnd(p.price)}</td><td>${p.stock}</td>
<td><button onclick="editP(${p.id})">Sửa</button> ${adm?`<button class="d" onclick="delP(${p.id})">Xóa</button>`:''}</td></tr>`).join('')}</table></div>`+
(adm?`<h2 style="margin-top:24px">Quản lý tài khoản</h2><form class="row" onsubmit="event.preventDefault();addU()"><input id="un" placeholder="Tên đăng nhập" required><input id="uf" placeholder="Họ tên" required><input id="up" type="password" placeholder="Mật khẩu" required>
<select id="ur">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="p">Thêm</button></form>
<div class="wrap"><table><tr><th>Tài khoản</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.fullName)}</td>
<td><select onchange="setRole(${u.id},this.value)">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v}</option>`).join('')}</select></td>
<td class="${u.locked?'locked':''}">${u.locked?'Đã khóa':'Hoạt động'}</td><td><button onclick="editU(${u.id})">Sửa tên</button> <button class="${u.locked?'':'d'}" onclick="lockU(${u.id})">${u.locked?'Mở khóa':'Khóa'}</button></td></tr>`).join('')}</table></div>`:'')});
const saveC=run(async()=>{const id=$('#cid').value;await api(id?'PUT':'POST','/api/categories'+(id?'/'+id:''),{name:$('#cn').value,description:$('#cd').value});toast('Đã lưu danh mục');adminV()});
function editC(id){const c=cats.find(x=>x.id===id);$('#cid').value=id;$('#cn').value=c.name;$('#cd').value=c.description||'';scrollTo(0,0)}
const delC=run(async id=>{if(confirm('Xóa danh mục này?')){await api('DELETE','/api/categories/'+id);adminV()}});
const saveP=run(async()=>{const id=$('#pid').value,f=$('#pf').files[0];if(f&&(f.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type)))throw new Error('Chọn ảnh JPG, PNG hoặc WEBP tối đa 2MB');
const p=await api(id?'PUT':'POST','/api/products'+(id?'/'+id:''),{name:$('#pn').value,description:$('#pd').value,categoryId:$('#pc').value,image:$('#pi').value,price:$('#pp').value,stock:$('#ps').value});
if(f){const fd=new FormData();fd.append('file',f);const r=await fetch('/api/products/'+p.id+'/image',{method:'POST',body:fd});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||'Upload ảnh thất bại')}
toast('Đã lưu sản phẩm');adminV()});
let productImagePreviewUrl='';
function previewProductImage(src){const file=$('#pf').files[0];const preview=$('#pf-preview');if(productImagePreviewUrl){URL.revokeObjectURL(productImagePreviewUrl);productImagePreviewUrl=''}
const image=file?URL.createObjectURL(file):src;if(file)productImagePreviewUrl=image;
const invalid=file&&(file.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type));
preview.innerHTML=invalid?'Ảnh phải là JPG, PNG hoặc WEBP và không quá 2MB.':image?`<img src="${esc(image)}" alt="Ảnh xem trước sản phẩm"><span>${file?esc(file.name):'Ảnh hiện tại'}${file?' • '+(file.size/1024/1024).toFixed(2)+' MB':''}</span>`:'Chưa chọn ảnh (JPG, PNG hoặc WEBP, tối đa 2MB)'}
function editP(id){const p=prods.find(x=>x.id===id);$('#pid').value=id;$('#pn').value=p.name;$('#pd').value=p.description||'';$('#pc').value=p.category?.id;$('#pi').value=p.image&&p.image[0]!=='/'?p.image:'';$('#pp').value=p.price;$('#ps').value=p.stock;$('#pf').value='';previewProductImage(p.image&&p.image.startsWith('/')?p.image:'');scrollTo(0,0)}
const delP=run(async id=>{if(confirm('Xóa sản phẩm này?')){await api('DELETE','/api/products/'+id);adminV()}});
const addU=run(async()=>{await api('POST','/api/users',{username:$('#un').value,fullName:$('#uf').value,password:$('#up').value,role:$('#ur').value});toast('Đã thêm tài khoản');adminV()});
const setRole=run(async(id,role)=>{try{await api('PUT','/api/users/'+id,{role});toast('Đã đổi quyền')}finally{adminV()}});
const editU=run(async id=>{const f=prompt('Họ tên mới:');if(f){await api('PUT','/api/users/'+id,{fullName:f});adminV()}});
const lockU=run(async id=>{await api('PUT','/api/users/'+id+'/lock');adminV()});

// ---- Đăng nhập / đăng ký ----
function authV(m){const reg=m==='register';$('#main').innerHTML=`<div class="card" style="max-width:420px;margin:auto"><h2>${reg?'Đăng ký':'Đăng nhập'}</h2><form class="f" onsubmit="event.preventDefault();auth('${m}')">
${reg?'<input id="af" placeholder="Họ tên" required>':''}<input id="au" placeholder="Tên đăng nhập" required><input id="ap" type="password" placeholder="Mật khẩu (≥6 ký tự)" required><button class="p">${reg?'Tạo tài khoản':'Đăng nhập'}</button></form>
<p class="mut">Demo: admin/admin123 • nhanvien/nv123456 • khach/khach123</p></div>`}
const auth=run(async m=>{me=await api('POST','/api/'+m,{username:$('#au').value,password:$('#ap').value,fullName:$('#af')?.value});toast('Xin chào '+me.fullName);go('shop')});
(async()=>{try{me=await api('GET','/api/me')}catch(e){}go('shop')})();
</script></body></html>
